name: Build BoardMate APKs (Manager & Tenant)

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Manager and Tenant APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build BoardMate Manager APK
        run: flutter build apk --flavor manager -t lib/main_manager.dart --release

      - name: Build BoardMate Tenant APK
        run: flutter build apk --flavor tenant -t lib/main_tenant.dart --release

      - name: Organize APK outputs
        run: |
          mkdir -p release-apks
          find build/app/outputs -name "*manager*release*.apk" -exec cp {} release-apks/BoardMate-Manager-v1.0.apk \; || true
          find build/app/outputs -name "*tenant*release*.apk" -exec cp {} release-apks/BoardMate-Tenant-v1.0.apk \; || true
          # Catch-all copy if flavors put them in another subfolder
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp -u {} release-apks/ \; 2>/dev/null || true
          echo "Found APK files:"
          ls -la release-apks/

      - name: Upload Manager & Tenant APKs
        uses: actions/upload-artifact@v4
        with:
          name: boardmate-release-apks
          path: release-apks/*.apk
          if-no-files-found: warn
