plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.boardmate.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 26 // Android 8.0 Oreo
        targetSdk = 34 // Android 14
        versionCode = 1
        versionName = "1.0.0"
    }

    // 2 Distinct Role Flavors
    flavorDimensions "role"
    productFlavors {
        manager {
            dimension "role"
            applicationId "com.boardmate.manager"
            resValue "string", "app_name", "BoardMate Manager"
            versionNameSuffix "-manager"
        }
        tenant {
            dimension "role"
            applicationId "com.boardmate.tenant"
            resValue "string", "app_name", "BoardMate Tenant"
            versionNameSuffix "-tenant"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug // For local builds; replace with keystore for Play Store
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
